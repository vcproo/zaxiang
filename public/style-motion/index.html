<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>画风与动效速查</title>
<meta name="description" content="17 种视频画风和 34 个常用动效，每一个都配实时演示。找到喜欢的，复制名字交给你的 AI。">
<style>
/* 外壳：一条顶栏放两个页签，下面整屏是当前页面（各自在 iframe 里，样式互不影响） */
:root { --bg: #E8E7E2; --bar: #F5F4F0; --ink: #17181B; --muted: #5E5F65; --line: #CBC9C2; --accent: #2B44C9; color-scheme: light;
  --display: "Noto Serif SC", "Songti SC", serif; --body: "Noto Sans SC", "PingFang SC", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101113; --bar: #18191C; --ink: #ECEAE4; --muted: #9C9DA3; --line: #2C2D31; --accent: #93A4FF; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #101113; --bar: #18191C; --ink: #ECEAE4; --muted: #9C9DA3; --line: #2C2D31; --accent: #93A4FF; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 18px; padding: calc(env(safe-area-inset-top, 0px) + 8px) clamp(16px, 4vw, 48px) 0; background: var(--bar); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 900; font-size: 18px; padding-bottom: 8px; margin-right: auto; }
nav { display: flex; gap: 4px; }
nav a { color: var(--muted); text-decoration: none; font-size: 15px; padding: 8px 14px 10px; border-bottom: 3px solid transparent; }
nav a small { font-size: 12px; margin-left: 4px; opacity: .7; }
nav a[aria-current="page"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
main { flex: 1; position: relative; min-height: 0; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
@media (max-width: 420px) { .brand { font-size: 16px; } nav a { padding-inline: 10px; } }
</style>
<header>
  <div class="brand">画风与动效速查</div>
  <nav aria-label="页面">
    <a href="#style" data-tab="style">画风导览<small>17 种</small></a>
    <a href="#motion" data-tab="motion">动效词典<small>34 个</small></a>
  </nav>
</header>
<main>
  <iframe id="f-style" title="画风导览" data-src="styles.html"></iframe>
  <iframe id="f-motion" title="动效词典" data-src="motion.html" hidden></iframe>
</main>
<script>
(function () {
  const tabs = { style: document.getElementById('f-style'), motion: document.getElementById('f-motion') };
  function show(name) {
    if (!tabs[name]) name = 'style';
    for (const [k, f] of Object.entries(tabs)) {
      const on = k === name;
      if (on && !f.src) f.src = f.dataset.src;   // 第一次切到才加载，另一页的动画不占资源
      f.hidden = !on;
    }
    document.querySelectorAll('nav a').forEach(a => { if (a.dataset.tab === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }
  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
})();
</script>

</body></html>
